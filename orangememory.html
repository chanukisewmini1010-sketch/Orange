<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories 💙</title>

<style>

body{
    margin:0;
    font-family:Arial;
    height:100vh;
    display:flex;
    overflow:hidden;
}

/* TITLE */
h1{
    font-family: "Great Vibes", cursive;
    margin-top:30px;
    color:#0077ff;
    text-shadow:0 5px 10px rgba(0,0,0,0.2);
}

/* SLIDER BOX */
.slider-container{
    width:90%;
    max-width:400px;
    margin:50px auto;
    overflow:hidden;

    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);

    background:white;
}

/* SLIDER */
.slider{
    display:flex;
    width:100%;
    transition:0.5s ease-in-out;
}

.slider img{
    width:100%;
    flex-shrink:0;
    height:400px;
    object-fit:cover;
    border-radius:20px;
}

/* BUTTON AREA */
.buttons{
    margin-top:20px;
}

/* BUTTONS */
button{
    font-family: "Great Vibes", cursive;
    padding:12px 25px;
    border:1px solid rgba(255,255,255,0.4);
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
    margin:10px;

    background:rgba(255,255,255,0.15);
    color:#0077ff;
    font-weight:bold;

    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    transition:0.3s ease;
}

button:hover{
    transform:scale(1.1);
    background:rgba(255,255,255,0.3);
}
.side{
    width:25%;
    height:100vh;
    background-size:cover;
    background-position:center;
    position:relative;
}

/* dark overlay */
.side::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
}

/* LEFT IMAGE */
.left{
    background:url("39.jpg");
}

/* RIGHT IMAGE */
.right{
    background:url("39.jpg");
}
.center{
    width:50%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#e0f7ff);
    overflow:hidden;
}
</style>
</head>

<body>

<<div class="side left"></div>

<div class="center">

    <h1>📸 Our Beautiful Memories 💙</h1>

    <div class="slider-container">
        <div class="slider" id="slider">

            <img src="5.jpg">
            <img src="27.jpg">
            <img src="21.jpg">
            <img src="26.jpg">
            <img src="16.jpg">
            <img src="19.jpg">
            <img src="23.jpg">
            <img src="24.jpg">
            <img src="15.jpg">
            <img src="20.jpg">

        </div>
    </div>

    <div class="buttons">
        <button onclick="prev()">⬅ Prev</button>
        <button onclick="next()">Next ➡</button>
    </div>

    <a href="orangefinal.html">
        <button>🎁 Go To Final Surprise</button>
    </a>

</div>

<div class="side right"></div>
<script>

let index = 0;
const totalSlides = 10;

function showSlide(){
    document.getElementById("slider").style.transform =
    "translateX(" + (-index * 100) + "%)";
}

function next(){
    if(index < totalSlides - 1){
        index++;
        showSlide();
    }
}

function prev(){
    if(index > 0){
        index--;
        showSlide();
    }
}

</script>

</body>
</html>
