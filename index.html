<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday 💙</title>

<style>
body{
    margin:0;
    height:100vh;
    font-family:Arial;
    background:linear-gradient(135deg,#4facfe,#e0f7ff);
    overflow:hidden;
    text-align:center;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* TITLE */
h1{
    font-family: 'Dancing Script', cursive;
    font-size:5rem;
    color:#0077ff;
    letter-spacing:4px;
}

/* SUB TEXT */
p{
    font-family: "Great Vibes", cursive;
    font-size:1.1rem;
    color:#333;
    opacity:0;
    animation:fadeIn 3s ease forwards;
    animation-delay:4s;
}

/* BUTTON */
button{
    font-family: "Great Vibes", cursive;
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:#0077ff;
    color:white;
    font-size:18px;
    cursor:pointer;
    opacity:0;
    animation:fadeIn 3s ease forwards;
    animation-delay:5.5s;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

/* FADE */
@keyframes fadeIn{
    to{opacity:1;}
}

/* ===== FLOATING PHOTO (LIKE HEARTS STYLE) ===== */
.photo{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:20px;
    border:3px solid white;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);

    position:absolute;
    bottom:-200px;
    animation:floatPhoto 12s linear infinite;
}

/* different positions */
.p1{ left:15%; animation-delay:0s; }
.p2{ left:35%; animation-delay:2s; }
.p3{ left:55%; animation-delay:4s; }
.p4{ left:75%; animation-delay:6s; }
.p5{ left:85%; animation-delay:8s; }

/* floating animation */
@keyframes floatPhoto{
    0%{
        transform:translateY(0) scale(1);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    50%{
        transform:translateY(-50vh) translateX(20px) scale(1.05);
    }
    100%{
        transform:translateY(-120vh) translateX(-20px) scale(0.95);
        opacity:0;
    }
}

/* HEARTS */
.heart{
    position:absolute;
    bottom:-20px;
    font-size:20px;
    animation:float 6s linear infinite;
}

@keyframes float{
    to{
        transform:translateY(-110vh);
    }
}

</style>
</head>

<body>

<!-- FLOATING PHOTOS (replace with your images) -->
<img src="2.jpeg" class="photo p1">
<img src="14.jpg" class="photo p2">
<img src="27.jpg" class="photo p3">
<img src="16.jpg" class="photo p4">
<img src="8.jpg" class="photo p5">

<!-- TITLE -->
<h1 id="text"></h1>

<p>💙 A special surprise is waiting for you...</p>

<a href="orangegame.html">
<button>Open Surprise 🎁</button>
</a>

<script>

// ===== TYPEWRITER TEXT =====
let text = "HAPPY BIRTHDAY ❤️";
let i = 0;

function typeWriter(){
    if(i < text.length){
        document.getElementById("text").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter,150);
    }
}
typeWriter();

// ===== FLOATING HEARTS =====
function createHeart(){
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💙";

    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (3+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),6000);
}

setInterval(createHeart,400);

</script>

</body>
</html>
